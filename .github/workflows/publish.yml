name: Build and Publish Image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/comfyui-minimax-template

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          REF="${{ github.ref }}"
          TAGS="$IMAGE_NAME:$SHA"
          if [[ "$REF" == refs/heads/master ]]; then TAGS="$TAGS,$IMAGE_NAME:latest"; fi
          if [[ "$REF" == refs/tags/* ]]; then TAGS="$TAGS,$IMAGE_NAME:${REF#refs/tags/}"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
